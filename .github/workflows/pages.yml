# Веб-версия Astra на GitHub Pages: https://gggssaggg-beep.github.io/astra/
# Собирается из того же main, что APK/OTA — каждая правка доезжает сама.
# Данные в браузере живут в localStorage (без durable Preferences телефона);
# пуши/вибро — только в APK. Вход в Сообщество с веба требует добавить
# https://gggssaggg-beep.github.io/astra/ в Supabase auth → Redirect URLs.
name: Веб-версия (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # полная история — номер сборки = число коммитов
      - name: Штамп версии сборки (номер = число коммитов; совпадает с APK)
        working-directory: app
        run: |
          # без штампа сайт показывал голую '0.1.0' — не понять, свежая ли версия.
          # rev-list --count даёт тот же номер, что и APK-сборка на этом коммите.
          BASE=$(grep -oP "APP_VERSION = '\K[0-9.]+" src/lib/version.ts)
          VER="${BASE}.$(git rev-list --count HEAD)"
          sed -i "s/APP_VERSION = '[0-9.]*'/APP_VERSION = '${VER}'/" src/lib/version.ts
          echo "версия веб-сборки: $VER"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Установка зависимостей
        run: npm ci
        working-directory: app
      - name: Сборка веб-версии
        run: npm run build
        working-directory: app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
