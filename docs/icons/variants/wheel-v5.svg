<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Astra icon v5: «Сердце-Солнце» — тригон + оппозиция, но Солнце вынесено в ЦЕНТР
       колеса (смысловое ядро) со свечением; двойное кольцо, деления, глубокая аврора.
       Adaptive-safe: всё в центральных ~66%. -->
  <defs>
    <radialGradient id="v5bg" cx="30%" cy="30%" r="98%">
      <stop offset="0%" stop-color="#1a2150"/>
      <stop offset="48%" stop-color="#0b1030"/>
      <stop offset="100%" stop-color="#070a1c"/>
    </radialGradient>
    <radialGradient id="v5aur1" cx="80%" cy="20%" r="58%">
      <stop offset="0%" stop-color="#9b8cff" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#9b8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="v5aur2" cx="16%" cy="84%" r="60%">
      <stop offset="0%" stop-color="#7fd0ff" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#7fd0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="v5ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cdd6ff"/>
      <stop offset="100%" stop-color="#9b8cff"/>
    </linearGradient>
    <radialGradient id="v5sun" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#fff4d6"/>
      <stop offset="50%" stop-color="#f3c969"/>
      <stop offset="100%" stop-color="#f3c969"/>
    </radialGradient>
    <radialGradient id="v5glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4d6" stop-opacity="0.95"/>
      <stop offset="38%" stop-color="#f3c969" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f3c969" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#v5bg)"/>
  <rect width="512" height="512" fill="url(#v5aur1)"/>
  <rect width="512" height="512" fill="url(#v5aur2)"/>
  <!-- звёзды + искорки -->
  <g fill="#cdd6ff">
    <circle cx="94" cy="116" r="4.4" opacity="0.72"/>
    <circle cx="424" cy="124" r="3" opacity="0.55"/>
    <circle cx="450" cy="336" r="3.4" opacity="0.6"/>
    <circle cx="84" cy="360" r="2.8" opacity="0.5"/>
  </g>
  <g fill="#fff4d6">
    <path d="M406 402 l5 18 l5 -18 l18 -5 l-18 -5 l-5 -18 l-5 18 l-18 5 z" opacity="0.85"/>
    <path d="M104 428 l4 13 l4 -13 l13 -4 l-13 -4 l-4 -13 l-4 13 l-13 4 z" opacity="0.7"/>
  </g>
  <!-- двойное кольцо + 12 делений -->
  <circle cx="256" cy="256" r="152" fill="none" stroke="url(#v5ring)" stroke-width="14"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#9b8cff" stroke-width="6" opacity="0.5"/>
  <g stroke="#cdd6ff" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <line x1="256" y1="97" x2="256" y2="113"/>
    <line x1="256" y1="399" x2="256" y2="415"/>
    <line x1="97" y1="256" x2="113" y2="256"/>
    <line x1="399" y1="256" x2="415" y2="256"/>
    <line x1="144" y1="144" x2="155" y2="155"/>
    <line x1="357" y1="357" x2="368" y2="368"/>
    <line x1="368" y1="144" x2="357" y2="155"/>
    <line x1="155" y1="357" x2="144" y2="368"/>
  </g>
  <!-- тригон (золото) + оппозиция (роза) — по внутреннему полю -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M256 150 L347 308 L165 308 Z" stroke="#f3c969" stroke-width="13"/>
    <line x1="176" y1="192" x2="336" y2="320" stroke="#e8888f" stroke-width="11"/>
  </g>
  <!-- планеты (серебро/циан/роза) на вершинах -->
  <circle cx="347" cy="308" r="15" fill="#7fd0ff"/>
  <circle cx="165" cy="308" r="15" fill="#cdd6ff"/>
  <circle cx="176" cy="192" r="12" fill="#e8888f"/>
  <circle cx="336" cy="320" r="12" fill="#9b8cff"/>
  <!-- Солнце — сердце колеса, в центре, крупное свечение -->
  <circle cx="256" cy="256" r="66" fill="url(#v5glow)"/>
  <circle cx="256" cy="256" r="30" fill="url(#v5sun)"/>
</svg>
