<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Astra launcher concept 2: «Искра с орбитой» — четырёхлучевая звезда
       (мотив блёсток/Сообщества ✧) + наклонная орбита с планетой. -->
  <defs>
    <radialGradient id="bg2" cx="30%" cy="22%" r="95%">
      <stop offset="0%" stop-color="#181f4e"/>
      <stop offset="50%" stop-color="#0c1130"/>
      <stop offset="100%" stop-color="#06091c"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff4d6"/>
      <stop offset="55%" stop-color="#f3c969"/>
      <stop offset="100%" stop-color="#e8a03e"/>
    </linearGradient>
    <linearGradient id="orb2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9b8cff"/>
      <stop offset="100%" stop-color="#7fd0ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg2)"/>
  <g fill="#cdd6ff">
    <circle cx="108" cy="108" r="4" opacity="0.7"/>
    <circle cx="430" cy="130" r="3" opacity="0.5"/>
    <circle cx="88" cy="380" r="3.4" opacity="0.55"/>
    <circle cx="410" cy="420" r="4" opacity="0.6"/>
  </g>
  <!-- наклонная орбита -->
  <g transform="rotate(-24 256 256)">
    <ellipse cx="256" cy="256" rx="168" ry="64" fill="none" stroke="url(#orb2)" stroke-width="12" opacity="0.9"/>
    <circle cx="412" cy="238" r="17" fill="#7fd0ff"/>
  </g>
  <!-- четырёхлучевая искра -->
  <path d="M256 118 C266 200 312 246 394 256 C312 266 266 312 256 394 C246 312 200 266 118 256 C200 246 246 200 256 118 Z"
    fill="url(#star)"/>
  <circle cx="256" cy="256" r="26" fill="#fff8e6"/>
  <!-- маленькая искорка-спутник -->
  <path d="M366 132 c3 18 13 28 31 31 c-18 3 -28 13 -31 31 c-3 -18 -13 -28 -31 -31 c18 -3 28 -13 31 -31 z" fill="#cdd6ff"/>
</svg>
