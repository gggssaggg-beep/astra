// astra-engine — расчётное ядро Astra на Java (западная школа).
//
// Эфемериды — Java-порт Swiss Ephemeris (Томас Мак), исходники лежат ЗДЕСЬ ЖЕ,
// в src/main/java/de/thmac/swisseph. Внешней зависимости нет намеренно: ни
// Maven Central, ни JitPack этот порт не отдают (JitPack публикует метаданные,
// но сами файлы возвращает 404 — проверено), а библиотека должна собираться
// офлайн и целиком. Происхождение и лицензия — в THIRD-PARTY.md.
plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'ru.svcode.astra'
version = '0.1.0'

repositories {
    mavenCentral()   // только для тестовых зависимостей (JUnit, Jackson)
}

// Кириллица в наших исходниках и градусы в комментариях порта — фиксируем UTF-8
// явно, иначе javac берёт кодировку системы и на другой машине сборка падает.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

java {
    // 17 — работает и на обычной JVM, и в Android (desugaring для java.time не нужен с API 26+)
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
}

dependencies {
    // эфемерид в зависимостях НЕТ — порт собирается из исходников этой же папки

    // только для тестов: чтение золотых файлов
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // золотые файлы и эфемериды ищем по путям, заданным сборкой
    systemProperty 'astra.golden', file('golden').absolutePath
    systemProperty 'astra.ephe', file('../ephe').absolutePath
    testLogging { events 'passed', 'failed', 'skipped'; showStandardStreams = true }
}

publishing {
    publications {
        library(MavenPublication) { from components.java }
    }
}
