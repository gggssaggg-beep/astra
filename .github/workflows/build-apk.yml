name: Сборка Android APK (Astra)

# Собирает debug-APK в облаке GitHub (бесплатно для публичного репозитория).
# Запуск: автоматически при push в main, либо вручную (вкладка Actions → Run workflow).
# Готовый файл — внизу страницы запуска, артефакт "astra-apk".

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Сборки по очереди, не параллельно: две параллельные гонялись за push APK
# обратно в main — проигравшая падала «fetch first» (случай 2026-07-02).
concurrency:
  group: build-apk-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # чтобы закоммитить готовый APK обратно в репо
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # полная история — номер сборки = число коммитов (совпадает с веб-версией)

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21 (нужен для Capacitor/Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Штамп версии сборки (builtin APK = версия OTA-манифеста)
        working-directory: app
        run: |
          # раньше веб собирался с базовой '0.1.0', а манифест писал '0.1.0.NN' —
          # свежий APK сразу «видел обновление» и качал байт-в-байт тот же бандл
          # номер сборки = число коммитов (git rev-list) — тот же счётчик, что у
          # веб-версии (pages.yml), поэтому сайт и APK показывают ОДНУ версию.
          BASE=$(grep -oP "APP_VERSION = '\K[0-9.]+" src/lib/version.ts)
          VER="${BASE}.$(git rev-list --count HEAD)"
          sed -i "s/APP_VERSION = '[0-9.]*'/APP_VERSION = '${VER}'/" src/lib/version.ts
          echo "версия сборки: $VER"

      - name: Сборка веб-части и синхронизация Capacitor
        working-directory: app
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Фиксированный keystore подписи (создать один раз при первом запуске)
        working-directory: app/android/app
        run: |
          if [ ! -f astra-debug.keystore ]; then
            keytool -genkeypair -v -keystore astra-debug.keystore \
              -storepass astrasky -keypass astrasky -alias astra \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Astra, OU=Astra, O=Astra, L=City, ST=State, C=RU"
            echo "СОЗДАН новый keystore — будет закоммичен и переиспользован далее"
          else
            echo "keystore уже есть — переиспользуем (подпись стабильна)"
          fi

      - name: Сборка APK (Gradle)
        working-directory: app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Выложить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: astra-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: OTA-бандл веб-части + манифест (для живых обновлений)
        run: |
          mkdir -p apk
          # bundle.zip = содержимое dist (index.html в корне zip — так ждёт Capgo)
          (cd app/dist && zip -r -q ../../apk/bundle.zip .)
          # version.ts уже проштампован полной версией на шаге выше
          VER=$(grep -oP "APP_VERSION = '\K[0-9.]+" app/src/lib/version.ts)
          URL="https://raw.githubusercontent.com/gggssaggg-beep/astra/main/apk/bundle.zip"
          printf '{\n  "version": "%s",\n  "url": "%s",\n  "notes": "build %s (%s)"\n}\n' \
            "$VER" "$URL" "$VER" "${GITHUB_SHA::7}" > apk/latest.json
          echo "OTA версия: $VER"

      - name: Обновить APK + OTA-бандл в репо (та же ссылка для скачивания)
        run: |
          # Артефакты — во времянку: дальше жёстко перечитываем свежий main.
          # (Прежний rebase падал на БИНАРНОМ конфликте apk/*, когда две сборки
          # шли подряд — «could not apply … APK+OTA», сборка 2026-07-06.)
          cp app/android/app/build/outputs/apk/debug/app-debug.apk /tmp/Astra.apk
          cp apk/bundle.zip /tmp/bundle.zip
          cp apk/latest.json /tmp/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p apk
            cp /tmp/Astra.apk apk/Astra.apk
            cp /tmp/bundle.zip apk/bundle.zip
            cp /tmp/latest.json apk/latest.json
            # -f: keystore под *.keystore в .gitignore, но фиксированный ключ нужен в репо
            git add -f app/android/app/astra-debug.keystore
            git add apk/Astra.apk apk/bundle.zip apk/latest.json
            git commit -m "APK + OTA авто-сборка [skip ci]" || { echo "без изменений"; exit 0; }
            git push && exit 0
            echo "пуш не прошёл (гонка) — попытка $i, перечитываю main"
          done
          echo "не удалось запушить за 3 попытки" && exit 1
