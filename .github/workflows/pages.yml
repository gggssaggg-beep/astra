# Веб-версия Astra на GitHub Pages: https://gggssaggg-beep.github.io/astra/
# Собирается из того же main, что APK/OTA — каждая правка доезжает сама.
# Данные в браузере живут в localStorage (без durable Preferences телефона);
# пуши/вибро — только в APK. Вход в Сообщество с веба требует добавить
# https://gggssaggg-beep.github.io/astra/ в Supabase auth → Redirect URLs.
name: Веб-версия (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Установка зависимостей
        run: npm ci
        working-directory: app
      - name: Сборка веб-версии
        run: npm run build
        working-directory: app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
